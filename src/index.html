<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Kaplan Food Schedule</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f6f4f">
  <meta name="apple-mobile-web-app-title" content="Schedule">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css?v=__V__">
  <style>
    #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none; }
    #splash .sp-bg { position: absolute; inset: 0; background: #1f6e4e; will-change: transform; }
    #splash .sp-glow { position: absolute; inset: -25%; pointer-events: none;
      background:
        radial-gradient(34% 30% at 50% 44%, rgba(140, 240, 185, .34), transparent 72%),
        radial-gradient(55% 45% at 85% 105%, rgba(6, 36, 22, .55), transparent 70%),
        radial-gradient(45% 40% at 8% -4%, rgba(255, 255, 255, .10), transparent 70%);
      animation: sp-drift 4s ease-in-out infinite alternate; }
    #splash .sp-center { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -4vh; }
    #splash .sp-logo { position: relative; width: 116px; height: 116px; border-radius: 28%; overflow: hidden; will-change: transform;
      box-shadow: 0 22px 50px rgba(0, 0, 0, .30), 0 0 0 1px rgba(255, 255, 255, .10);
      animation: sp-pop .55s cubic-bezier(.34, 1.56, .64, 1) both; }
    #splash .sp-logo img { width: 100%; height: 100%; display: block; }
    #splash .sp-logo::after { content: ""; position: absolute; inset: -40%; transform: translateX(-120%) rotate(18deg);
      background: linear-gradient(90deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%);
      animation: sp-shine 1.1s cubic-bezier(.45, 0, .2, 1) .35s both; }
    #splash .sp-text { display: flex; flex-direction: column; align-items: center; margin-top: 26px; }
    #splash .sp-title { font-size: 30px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
    #splash .sp-title span { display: inline-block; animation: sp-letter .42s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(.12s + var(--i) * .022s); }
    #splash .sp-sub { margin-top: 6px; font-size: 13px; font-weight: 700; text-transform: uppercase; color: rgba(225, 246, 234, .78);
      animation: sp-sub .6s cubic-bezier(.22, 1, .36, 1) .26s both; }
    #splash .sp-bar { margin-top: 26px; width: 132px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .16); overflow: hidden; animation: sp-fade .3s ease .45s both; }
    #splash .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, transparent, #bff2d4, transparent);
      animation: sp-load 1.05s cubic-bezier(.6, 0, .4, 1) infinite; }
    @keyframes sp-pop { from { opacity: 0; transform: scale(.55) rotate(-8deg); } to { opacity: 1; transform: none; } }
    @keyframes sp-shine { to { transform: translateX(120%) rotate(18deg); } }
    @keyframes sp-letter { from { opacity: 0; transform: translateY(16px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes sp-sub { from { opacity: 0; letter-spacing: .08em; } to { opacity: 1; letter-spacing: .42em; } }
    @keyframes sp-fade { from { opacity: 0; } }
    @keyframes sp-load { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @keyframes sp-drift { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(2%, 1.5%, 0) scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-bg"></div>
    <div class="sp-glow"></div>
    <div class="sp-center">
      <div class="sp-logo"><img src="icons/icon.svg" alt=""></div>
      <div class="sp-text">
        <div class="sp-title"><span style="--i:0">K</span><span style="--i:1">a</span><span style="--i:2">p</span><span style="--i:3">l</span><span style="--i:4">a</span><span style="--i:5">n</span><span style="--i:6">&nbsp;</span><span style="--i:7">F</span><span style="--i:8">o</span><span style="--i:9">o</span><span style="--i:10">d</span></div>
        <div class="sp-sub">Schedule</div>
        <div class="sp-bar"><i></i></div>
      </div>
    </div>
  </div>
  <script>setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 10000);</script>
  <div class="statusfill"></div>
  <div id="app"></div>
  <div id="modal"></div>
  <div id="toast"></div>
  <script type="module" src="app.js?v=__V__"></script>
</body>
</html>
